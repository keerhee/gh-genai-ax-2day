<style>
:root{
  --ground:#F7F5F0; --panel:#FFFFFF; --ink:#12262A; --soft:#3D5155; --mute:#6E8083;
  --line:#DCD9D1; --hair:#EAE7DF; --teal:#0B6B68; --tealbg:#E4EFEC;
  --lime:#B7F34A; --limebg:#F2FBDF; --red:#B0201F; --redbg:#FAEBE9; --ok:#0B6B68;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1E21; --panel:#152B2E; --ink:#EDEBE4; --soft:#C2CFCE; --mute:#8FA3A4;
    --line:#2A4145; --hair:#22383B; --teal:#5FCFB6; --tealbg:#16332F;
    --lime:#B7F34A; --limebg:#22331A; --red:#E8908A; --redbg:#331F1E; --ok:#5FCFB6;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1E21; --panel:#152B2E; --ink:#EDEBE4; --soft:#C2CFCE; --mute:#8FA3A4;
  --line:#2A4145; --hair:#22383B; --teal:#5FCFB6; --tealbg:#16332F;
  --lime:#B7F34A; --limebg:#22331A; --red:#E8908A; --redbg:#331F1E; --ok:#5FCFB6;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;
  font-family:"Pretendard","Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",system-ui,sans-serif;
  line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:44px 22px 80px}

header{border-bottom:3px solid var(--ink);padding-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--teal);font-weight:700}
h1{font-size:clamp(26px,4.4vw,36px);font-weight:800;letter-spacing:-.02em;margin:8px 0 10px;line-height:1.2}
.lede{color:var(--soft);font-size:15.5px;margin:0;max-width:60ch}

.bar{position:sticky;top:0;z-index:5;background:var(--ground);
  padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.track{flex:1;min-width:140px;height:7px;background:var(--hair);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--teal);transition:width .28s ease}
.stat{font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{color:var(--ink);font-weight:700}

.q{background:var(--panel);border:1px solid var(--line);margin-top:22px;padding:22px 22px 18px}
.qn{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--teal);
  border:1px solid var(--teal);padding:2px 8px;border-radius:99px;margin-bottom:10px}
.qt{font-size:17.5px;font-weight:600;line-height:1.55;margin:0 0 4px}
.qs{font-size:14.5px;color:var(--mute);margin:6px 0 0}
.opts{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);padding:12px 14px;
  font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--tealbg)}
.opt:disabled{cursor:default}
.opt:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.k{flex:0 0 auto;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.opt.correct{border-color:var(--ok);background:var(--limebg)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.wrong .k{color:var(--red)}
.mark{margin-left:auto;font-weight:800;font-size:15px}
.opt.correct .mark{color:var(--ok)}
.opt.wrong .mark{color:var(--red)}

.exp{margin-top:14px;border-left:4px solid var(--teal);background:var(--tealbg);
  padding:13px 16px;font-size:15px;color:var(--ink);display:none}
.exp.on{display:block}
.exp .lab{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--teal);
  display:block;margin-bottom:5px}
.exp b{font-weight:700}

.done{margin-top:34px;background:var(--ink);color:#F7F5F0;padding:26px 24px;display:none}
.done.on{display:block}
.done h2{margin:0 0 6px;font-size:23px;font-weight:800;color:var(--lime)}
.done p{margin:0;font-size:15.5px;color:#C2CFCE;line-height:1.65}
.done .score{font-size:40px;font-weight:800;color:#fff;margin:10px 0 4px;
  font-variant-numeric:tabular-nums}
.again{margin-top:18px;background:var(--lime);color:#12262A;border:none;
  padding:11px 22px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.again:hover{filter:brightness(.95)}

footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--mute)}
@media (max-width:600px){ .wrap{padding:30px 16px 60px} }
</style>
<style>
/* 부록과 같은 폰트 짝 — 제목 Gothic A1 900 · 본문 IBM Plex Sans KR 400/600 */
body{font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","맑은 고딕",system-ui,sans-serif}
h1,.done h2,.done .score{font-family:"Gothic A1","Apple SD Gothic Neo",sans-serif;font-weight:900;letter-spacing:-.02em}
.eyebrow,.qn,.exp .lab{font-weight:600}
.qt,.k,.mark,.stat b,.exp b,.again{font-weight:600}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">공공기관 생성형 AI 업무혁신 · 기초 3시간</div>
  <h1>기초 과정 이해 점검 10문항</h1>
  <p class="lede">보기를 누르면 바로 정답과 해설이 나옵니다. 실습 전 워밍업으로도, 실습 후 복습으로도 쓸 수 있습니다.</p>
</header>

<div class="bar">
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="stat"><b id="cnt">0</b> / 10 완료 · 정답 <b id="hit">0</b></div>
</div>

<div id="quiz"></div>

<div class="done" id="done">
  <h2 id="dt"></h2>
  <div class="score" id="ds"></div>
  <p id="dp"></p>
  <button class="again" id="again">다시 풀기</button>
</div>

<footer>기초 3시간 부속 자료 · 파일 하나로 동작하며 인터넷이 필요 없습니다.</footer>
</div>

  "o": [

  "o": [

   "가온동 담당자가 처리를 미루고 있다"
  ],
  "a": 0,
  "e": "데이터가 직접 말해 주는 것만 <b>[사실]</b>입니다. 인력·난이도·담당자 행태는 이 데이터로 확인되지 않으므로 [가설]이나 [추정]으로 표시하고, 확인할 방법을 함께 적습니다. 실습 5의 사실·가설·제안 표기가 이 구분입니다."
 },

  "q": "그래프 프롬프트에서 이것을 빠뜨리면 한글이 □□□로 나옵니다. 무엇입니까?",
  "o": [

  ],

  "e": "가장 흔한 실패입니다. 데이터 문제가 아니라 <b>폰트 미지정</b>입니다. “한글 폰트는 맑은 고딕, 없으면 NanumGothic으로 지정해줘” 한 줄이면 끝납니다. 나머지 넷도 넣어야 다시 그리지 않습니다 — 파일·컬럼, 차트 종류, 폰트, 제목·축, 저장 크기."

 {
  "q": "12개월 총민원 추이를 회의에서 보여주려 합니다. 적절한 차트는?",
  "o": [
   "파이 차트",
   "선그래프",
   "산점도",
   "히스토그램"
  ],
  "a": 1,
  "e": "<b>시간 흐름은 선</b>입니다. 항목 비교는 가로막대, 구성비는 100% 누적막대, 분포는 히스토그램, 두 값의 관계는 산점도. 참고로 파이는 항목이 5개를 넘으면 사람이 읽지 못하므로 보고서에서는 대부분 가로막대가 낫습니다."
 },
 {
  "q": "AI가 계산한 총합이 엑셀로 센 값과 다릅니다. 가장 먼저 물어볼 것은?",
  "o": [
   "“다시 계산해줘”",

  "o": [
   "최신 차트 라이브러리를 사용하라",
   "데이터를 서버로 보내지 말고 브라우저 안에서만 처리하라",
   "모바일 화면을 우선으로 만들어라",
   "가능한 한 화려하게 만들어라"
  ],
  "a": 1,
  "e": "세 가지가 한 묶음입니다 — <b>데이터를 서버로 보내지 않는다, 연락처는 화면에서도 마스킹한다, 인터넷 없이 열린다.</b> 그래서 외부 라이브러리를 쓰지 않고 HTML 한 파일로 만듭니다. 내부망에서는 라이브러리를 불러오는 순간 화면이 뜨지 않습니다."
 },
 {
  "q": "오늘 만든 것 중 다음 달에도 그대로 쓸 수 있는 것은?",
  "o": [
   "이번 달 보고서 PDF",
   "대시보드 화면 캡처",
   "검증된 프롬프트와 정제 규칙",
   "회의에서 나온 의견 메모"
  ],
  "a": 2,
  "e": "결과물은 이번 달로 끝나지만 <b>만드는 절차는 다음 달에도 돕니다.</b> 프롬프트·정제 규칙·계산식·README를 남겨 두면 새 CSV만 바꿔 다시 실행하면 됩니다. 이번 달에 만든 것이 다음 달에도 도는가 — 오늘 세 시간의 기준입니다."

];
const KEY = ["①","②","③","④"];
let cnt = 0, hit = 0;

function render(){
  cnt = 0; hit = 0;
  const box = document.getElementById("quiz");
  box.innerHTML = "";
  Q.forEach((q, i) => {
    const sec = document.createElement("section");
    sec.className = "q";
    const sub = q.s ? '<p class="qs">' + q.s + '</p>' : '';
    sec.innerHTML =
      '<span class="qn">문항 ' + (i+1) + '</span>' +
      '<p class="qt">' + q.q + '</p>' + sub +
      '<ul class="opts"></ul>' +
      '<div class="exp"><span class="lab">해설</span><span class="et"></span></div>';
    const ul = sec.querySelector(".opts");
    q.o.forEach((text, j) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = '<span class="k">' + KEY[j] + '</span><span>' + text + '</span>';
      b.addEventListener("click", () => answer(sec, q, j));
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(sec);
  });
  update();
  document.getElementById("done").classList.remove("on");
}

function answer(sec, q, pick){
  const btns = [...sec.querySelectorAll(".opt")];
  if (btns[0].disabled) return;
  btns.forEach((b, j) => {
    b.disabled = true;
    if (j === q.a){ b.classList.add("correct");
      b.insertAdjacentHTML("beforeend", '<span class="mark">정답</span>'); }
    else if (j === pick){ b.classList.add("wrong");
      b.insertAdjacentHTML("beforeend", '<span class="mark">선택</span>'); }
  });
  const exp = sec.querySelector(".exp");
  sec.querySelector(".et").innerHTML = q.e;
  exp.classList.add("on");
  cnt++; if (pick === q.a) hit++;
  update();
}

function update(){
  document.getElementById("cnt").textContent = cnt;
  document.getElementById("hit").textContent = hit;
  document.getElementById("fill").style.width = (cnt/Q.length*100) + "%";
  if (cnt === Q.length){
    const d = document.getElementById("done");
    const msg = hit >= 9 ? "실습에 바로 들어가셔도 됩니다."
              : hit >= 7 ? "핵심은 잡으셨습니다. 틀린 문항의 해설만 다시 읽어 보세요."
              : hit >= 5 ? "절반은 맞히셨습니다. 틀린 문항이 오늘 가장 많이 쓰는 부분입니다."
              : "해설을 위에서부터 한 번 훑고 다시 풀어 보세요. 10분이면 됩니다.";
    document.getElementById("dt").textContent = "다 푸셨습니다";
    document.getElementById("ds").textContent = hit + " / " + Q.length;
    document.getElementById("dp").textContent = msg;
    d.classList.add("on");
    d.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
}

document.getElementById("again").addEventListener("click", () => {
  render(); window.scrollTo({top:0, behavior:"smooth"});
});
render();
</script>
